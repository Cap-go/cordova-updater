name: Build source code and test it

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - renovate/**
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

env:
  BUN_VERSION: 1.3.12
  MAESTRO_VERSION: cli-2.4.0
  CAPGO_MAESTRO_DEVICE_BASE_URL: http://10.0.2.2:3192
  CAPGO_UPDATE_URL: http://10.0.2.2:3192/api/updates/manual-zip
  CAPGO_CHANNEL_URL: http://10.0.2.2:3192/api/channel?scenario=manual-zip
  CAPGO_STATS_URL: http://10.0.2.2:3192/api/stats?scenario=manual-zip

permissions: {}

jobs:
  build_android:
    permissions:
      contents: read
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Build and test Android plugin
        run: bun run verify:android

  build_ios:
    permissions:
      contents: read
    timeout-minutes: 20
    runs-on: macOS-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-${{ hashFiles('bun.lock', 'package.json') }}
          dependency-cache-path: node_modules
      - name: Check plugin wiring
        run: bun run check:wiring
      - name: Build iOS plugin
        run: bun run verify:ios
      - name: Run iOS native contract tests
        run: bun run native:contract:ios

  maestro_web_assets:
    permissions:
      contents: read
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Build Maestro web assets
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Build reusable Maestro web assets
        run: bun scripts/maestro/build-bundles.mjs all
      - name: Upload reusable Maestro web assets
        uses: actions/upload-artifact@v7
        with:
          name: maestro-web-assets
          path: |
            dist
            .maestro-artifacts
          include-hidden-files: true
          if-no-files-found: error

  maestro_android_apps:
    permissions:
      contents: read
    needs: maestro_web_assets
    timeout-minutes: 10
    runs-on: ubuntu-latest
    name: Build Android Maestro app / ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - manual-zip
          - manual-zip-no-persist
          - manual-zip-config-guards
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Download reusable Maestro web assets
        uses: actions/download-artifact@v7
        with:
          name: maestro-web-assets
          path: .
      - name: Build Android app
        run: bun scripts/maestro/prepare-android-scenario.mjs "${{ matrix.scenario }}"
      - name: Upload Android app
        uses: actions/upload-artifact@v7
        with:
          name: maestro-android-app-${{ matrix.scenario }}
          path: example-app/platforms/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error


  maestro_ios_apps:
    permissions:
      contents: read
    needs: maestro_web_assets
    timeout-minutes: 25
    runs-on: macOS-latest
    name: Build iOS Maestro apps
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Download reusable Maestro web assets
        uses: actions/download-artifact@v7
        with:
          name: maestro-web-assets
          path: .
      - name: Build iOS apps
        env:
          CAPGO_MAESTRO_DEVICE_BASE_URL: http://127.0.0.1:3192
        run: |
          set -euo pipefail
          simulator_id="$(./scripts/maestro/select-ios-simulator.sh)"
          xcrun simctl boot "$simulator_id" >/dev/null 2>&1 || true
          artifact_root="$RUNNER_TEMP/maestro-ios-apps"
          scenarios=(
            manual-zip
            manual-zip-no-persist
            manual-zip-config-guards
          )

          rm -rf "$artifact_root"
          mkdir -p "$artifact_root"

          for scenario in "${scenarios[@]}"; do
            app_artifact_path="$artifact_root/$scenario"
            bun scripts/maestro/prepare-ios-scenario.mjs "$scenario"
            (cd example-app/platforms/ios && pod install --repo-update)
            derived_data_path="$RUNNER_TEMP/maestro-ios-derived-$scenario"
            rm -rf "$derived_data_path"
            xcodebuild               -workspace "example-app/platforms/ios/Updater Example.xcworkspace"               -scheme "Updater Example"               -configuration Debug               -destination "generic/platform=iOS Simulator"               -derivedDataPath "$derived_data_path"               SWIFT_VERSION=5.0               IPHONEOS_DEPLOYMENT_TARGET=15.0               build
            app_path="$derived_data_path/Build/Products/Debug-iphonesimulator/Updater Example.app"
            if [[ ! -d "$app_path" ]]; then
              echo "Expected iOS app at $app_path" >&2
              exit 1
            fi
            bundled_index="$app_path/www/index.html"
            if [[ ! -f "$bundled_index" ]]; then
              echo "Missing bundled www/index.html at $bundled_index" >&2
              exit 1
            fi
            mkdir -p "$app_artifact_path"
            ditto "$app_path" "$app_artifact_path/App.app"
          done
      - name: Upload iOS apps
        uses: actions/upload-artifact@v7
        with:
          name: maestro-ios-apps
          path: ${{ runner.temp }}/maestro-ios-apps
          if-no-files-found: error

  maestro_ios:
    permissions:
      contents: read
    needs:
      - maestro_web_assets
      - maestro_ios_apps
    timeout-minutes: 25
    runs-on: macOS-latest
    name: iOS example app Maestro smoke / ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - manual-zip
          - manual-zip-no-persist
          - manual-zip-config-guards
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Boot iOS simulator early
        run: |
          set -euo pipefail
          simulator_id="$(./scripts/maestro/select-ios-simulator.sh)"
          echo "CAPGO_MAESTRO_IOS_SIMULATOR_ID=$simulator_id" >> "$GITHUB_ENV"
          xcrun simctl boot "$simulator_id" >/dev/null 2>&1 || true
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          install-dependencies: 'false'
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Download reusable Maestro web assets
        uses: actions/download-artifact@v7
        with:
          name: maestro-web-assets
          path: .
      - name: Download iOS app
        uses: actions/download-artifact@v7
        with:
          name: maestro-ios-apps
          path: maestro-ios-apps
      - name: Run Maestro smoke tests
        env:
          CAPGO_MAESTRO_DEVICE_BASE_URL: http://127.0.0.1:3192
        run: >-
          CAPGO_MAESTRO_SKIP_BUILD=1
          CAPGO_MAESTRO_SKIP_BUNDLE_BUILD=1
          CAPGO_MAESTRO_IOS_ASSUME_CLEAN_INSTALL=1
          CAPGO_MAESTRO_IOS_APP_PATH=maestro-ios-apps/${{ matrix.scenario }}/App.app
          CAPGO_MAESTRO_SMOKE_SCENARIO=${{ matrix.scenario }}
          CAPGO_MAESTRO_TEST_RETRIES=3
          CAPGO_MAESTRO_IOS_REINSTALL_ON_RETRY=1
          CAPGO_MAESTRO_TIMEOUT_SECONDS=600
          MAESTRO_DRIVER_STARTUP_TIMEOUT=300000
          bun run test:maestro:ios:smoke
      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-ios-${{ matrix.scenario }}
          path: maestro-results-ios

  maestro_android:
    permissions:
      contents: read
    needs:
      - maestro_web_assets
      - maestro_android_apps
    timeout-minutes: 25
    runs-on: ubuntu-latest
    name: Android example app Maestro smoke / ${{ matrix.scenario }}
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - manual-zip
          - manual-zip-no-persist
          - manual-zip-config-guards
    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Setup Bun
        uses: ./.github/actions/setup-bun
        with:
          bun-version: ${{ env.BUN_VERSION }}
          dependency-cache-key: ${{ runner.os }}-bun-deps-root-example-${{ hashFiles('bun.lock', 'package.json', 'example-app/package.json') }}
          dependency-cache-path: |
            node_modules
            example-app/node_modules
          install-example: 'true'
      - name: Setup java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: gradle
      - name: Setup Maestro
        uses: ./.github/actions/setup-maestro
        with:
          maestro-version: ${{ env.MAESTRO_VERSION }}
      - name: Download reusable Maestro web assets
        uses: actions/download-artifact@v7
        with:
          name: maestro-web-assets
          path: .
      - name: Download Android app
        uses: actions/download-artifact@v7
        with:
          name: maestro-android-app-${{ matrix.scenario }}
          path: example-app/platforms/android/app/build/outputs/apk/debug
      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Maestro smoke tests
        uses: reactivecircus/android-emulator-runner@0a638108440efd5c7f980e6ba145dbcdd8f32009 # v2.37.0
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_7
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: >-
            CAPGO_MAESTRO_SKIP_BUILD=1
            CAPGO_MAESTRO_SKIP_BUNDLE_BUILD=1
            CAPGO_MAESTRO_TIMEOUT_SECONDS=600
            CAPGO_MAESTRO_TEST_RETRIES=3
            CAPGO_MAESTRO_APP_UI_TIMEOUT_SECONDS=150
            CAPGO_MAESTRO_APP_LAUNCH_RETRIES=2
            MAESTRO_DRIVER_STARTUP_TIMEOUT=300000
            CAPGO_MAESTRO_SMOKE_SCENARIO=${{ matrix.scenario }}
            bun run test:maestro:android
      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: maestro-results-android-${{ matrix.scenario }}
          path: maestro-results
